<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Leandro De Lima Santos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da">
        <animate attributeName="stop-color" values="#0969da;#8250df;#1a7f37;#0969da" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8250df">
        <animate attributeName="stop-color" values="#8250df;#1a7f37;#0969da;#8250df" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8250df" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="258" rx="17" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="120" cy="50" r="150" fill="url(#glow1)"/>
  <circle cx="800" cy="230" r="160" fill="url(#glow2)"/>

  <rect x="48" y="64" width="72" height="5" rx="3" fill="url(#accent)"/>

  <text x="48" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#1f2328">Leandro De Lima Santos</text>
  <text x="48" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#656d76">Analista de Suporte de TI &#183; Estudante de ADS &#183; Automa&#231;&#227;o &amp; Python</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
    <rect x="48" y="198" width="86" height="32" rx="16" fill="#0969da" fill-opacity="0.10" stroke="#0969da" stroke-opacity="0.50"/>
    <text x="91" y="219" fill="#0969da" text-anchor="middle">Python</text>

    <rect x="144" y="198" width="96" height="32" rx="16" fill="#1a7f37" fill-opacity="0.10" stroke="#1a7f37" stroke-opacity="0.50"/>
    <text x="192" y="219" fill="#1a7f37" text-anchor="middle">Automa&#231;&#227;o</text>

    <rect x="250" y="198" width="96" height="32" rx="16" fill="#8250df" fill-opacity="0.10" stroke="#8250df" stroke-opacity="0.50"/>
    <text x="298" y="219" fill="#8250df" text-anchor="middle">Suporte TI</text>

    <rect x="356" y="198" width="96" height="32" rx="16" fill="#bf8700" fill-opacity="0.10" stroke="#bf8700" stroke-opacity="0.50"/>
    <text x="404" y="219" fill="#9a6700" text-anchor="middle">NFe / CTe</text>

    <rect x="462" y="198" width="86" height="32" rx="16" fill="#bf3989" fill-opacity="0.10" stroke="#bf3989" stroke-opacity="0.50"/>
    <text x="505" y="219" fill="#bf3989" text-anchor="middle">SQL</text>
  </g>
</svg>
