<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Leandro De Lima Santos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#3b82f6;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#3b82f6;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="258" rx="17" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="120" cy="50" r="150" fill="url(#glow1)"/>
  <circle cx="800" cy="230" r="160" fill="url(#glow2)"/>

  <rect x="48" y="64" width="72" height="5" rx="3" fill="url(#accent)"/>

  <text x="48" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">Leandro De Lima Santos</text>
  <text x="48" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">Analista de Suporte de TI &#183; Estudante de ADS &#183; Automa&#231;&#227;o &amp; Python</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
    <rect x="48" y="198" width="86" height="32" rx="16" fill="#1f6feb" fill-opacity="0.14" stroke="#1f6feb" stroke-opacity="0.65"/>
    <text x="91" y="219" fill="#79c0ff" text-anchor="middle">Python</text>

    <rect x="144" y="198" width="96" height="32" rx="16" fill="#238636" fill-opacity="0.14" stroke="#238636" stroke-opacity="0.65"/>
    <text x="192" y="219" fill="#56d364" text-anchor="middle">Automa&#231;&#227;o</text>

    <rect x="250" y="198" width="96" height="32" rx="16" fill="#a371f7" fill-opacity="0.14" stroke="#a371f7" stroke-opacity="0.65"/>
    <text x="298" y="219" fill="#d2a8ff" text-anchor="middle">Suporte TI</text>

    <rect x="356" y="198" width="96" height="32" rx="16" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-opacity="0.65"/>
    <text x="404" y="219" fill="#e3b341" text-anchor="middle">NFe / CTe</text>

    <rect x="462" y="198" width="86" height="32" rx="16" fill="#db61a2" fill-opacity="0.14" stroke="#db61a2" stroke-opacity="0.65"/>
    <text x="505" y="219" fill="#ff7eb6" text-anchor="middle">SQL</text>
  </g>
</svg>
